<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Alzado, planta y perfil de una pieza sencilla</title><desc id="desc">Tres vistas ortogonales alineadas de una pieza escalonada, con ejemplos de cotas de anchura, altura y fondo.</desc><defs><marker id="m" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 4L8 0v8z" fill="#a45f19"/></marker></defs><rect width="900" height="430" rx="24" fill="#f7faf8"/><text x="450" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#18384a">Una pieza, tres vistas alineadas</text>
<g fill="#dfeff2" stroke="#1a6b7a" stroke-width="4"><path d="M90 110H270V160H210V260H90Z"/><path d="M90 315H270V385H90Z"/><path d="M410 110H550V260H410Z"/></g>
<g font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#28567a" text-anchor="middle"><text x="180" y="92">Alzado</text><text x="180" y="410">Planta</text><text x="480" y="92">Perfil</text></g>
<g stroke="#a45f19" stroke-width="2" fill="none" marker-start="url(#m)" marker-end="url(#m)"><line x1="90" y1="285" x2="270" y2="285"/><line x1="60" y1="110" x2="60" y2="260"/><line x1="410" y1="285" x2="550" y2="285"/></g>
<g font-family="system-ui,sans-serif" font-size="16" fill="#7b4b1a" text-anchor="middle"><text x="180" y="280">anchura</text><text x="34" y="190" transform="rotate(-90 34 190)">altura</text><text x="480" y="280">fondo</text></g>
<rect x="625" y="120" width="220" height="210" rx="18" fill="#fff1d5" stroke="#c6922d" stroke-width="2"/><g font-family="system-ui,sans-serif" fill="#654d1c"><text x="735" y="158" text-anchor="middle" font-size="18" font-weight="700">Para leer las vistas</text><text x="650" y="198" font-size="16">• Mantén la alineación.</text><text x="650" y="232" font-size="16">• Usa solo las necesarias.</text><text x="650" y="266" font-size="16">• No repitas cotas.</text><text x="650" y="300" font-size="16">• Indica escala y unidad.</text></g>
</svg>
