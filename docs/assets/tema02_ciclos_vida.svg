<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Diferencia entre ciclo comercial y ciclo físico ambiental</title><desc id="desc">El ciclo comercial describe la evolución de la demanda; el ciclo físico sigue materiales y procesos desde las materias primas hasta la reutilización o el fin de vida.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1a6b7a"/></marker></defs><rect width="900" height="420" rx="24" fill="#f7faf8"/>
<text x="450" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#18384a">Dos ciclos que no deben confundirse</text>
<text x="55" y="95" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#28567a">Ciclo comercial · evolución de la demanda</text>
<path d="M70 175 C180 175 170 115 300 115 S420 115 510 150 S650 210 820 220" fill="none" stroke="#386da0" stroke-width="5"/><line x1="70" y1="230" x2="830" y2="230" stroke="#9fb2b6" stroke-width="2"/><g font-family="system-ui,sans-serif" font-size="15" fill="#334f59" text-anchor="middle"><text x="145" y="255">Introducción</text><text x="330" y="255">Crecimiento</text><text x="525" y="255">Madurez</text><text x="745" y="255">Declive o renovación</text></g>
<text x="55" y="315" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#245c49">Ciclo físico · recorrido de materiales y producto</text>
<g font-family="system-ui,sans-serif" font-size="15" font-weight="650" fill="#245c49" text-anchor="middle"><text x="100" y="370">Materias primas</text><text x="270" y="370">Fabricación</text><text x="425" y="370">Uso y cuidado</text><text x="600" y="370">Reparación</text><text x="790" y="370">Reutilización o fin</text></g>
<g stroke="#2b8c7f" stroke-width="3" marker-end="url(#a)"><line x1="165" y1="355" x2="210" y2="355"/><line x1="325" y1="355" x2="360" y2="355"/><line x1="495" y1="355" x2="530" y2="355"/><line x1="660" y1="355" x2="700" y2="355"/></g>
</svg>
