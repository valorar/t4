<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">Emisiones por viajero-kilómetro y la cadena del pozo a la rueda</title><desc id="desc">Diagrama en tres bandas. Arriba, un gráfico de barras horizontales con las emisiones medias de CO₂ por viajero y kilómetro de cada modo de transporte, según el IDAE: avión 192 gramos, coche térmico 121, moto térmica 53, autobús urbano 49, coche eléctrico 43, tren de cercanías 33, metro 30, tren de alta velocidad 24, moto eléctrica 14, bicicleta eléctrica 3 y andar o bicicleta 0. La línea de puntos marca el valor del autobús urbano como referencia. En medio, una banda muestra la cadena del pozo a la rueda: extracción del recurso, transformación en refinería o generación eléctrica, distribución hasta el punto de uso y por último el uso en el vehículo. Abajo, una banda recuerda de qué depende el resultado: de la ocupación del vehículo —el mismo coche pasa de unos 145 a unos 36 gramos por viajero-kilómetro según vaya con una o cuatro personas—, del origen de la electricidad del mix y de lo que haya costado fabricar el vehículo y su batería.</desc>
<defs>
<marker id="flecha" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#1a6b7a"/></marker>
</defs>
<rect width="900" height="620" rx="24" fill="#f7faf8"/>
<text x="450" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#18384a">Emisiones por viajero-kilómetro: del pozo a la rueda</text>
<text x="450" y="61" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14.5" fill="#466a75">Son medias con una ocupación supuesta: cambia la ocupación o el origen de la electricidad y el orden cambia.</text>

<text x="30" y="92" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#14625f" letter-spacing="1">GRAMOS DE CO₂ POR VIAJERO Y KILÓMETRO (IDAE, 2024)</text>

