<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#14495c">
<text x="136" y="436" font-size="13" font-weight="700">1. Extracción</text>
<text x="136" y="454" font-size="12" fill="#3f6672">petróleo, gas o uranio</text>
<text x="342" y="436" font-size="13" font-weight="700">2. Transformación</text>
<text x="342" y="454" font-size="12" fill="#3f6672">refinería o central eléctrica</text>
<text x="548" y="436" font-size="13" font-weight="700">3. Distribución</text>
<text x="548" y="454" font-size="12" fill="#3f6672">camión, barco o red</text>
<text x="759" y="436" font-size="13" font-weight="700">4. Uso</text>
<text x="759" y="454" font-size="12" fill="#3f6672">en el motor del vehículo</text>
</g>

<rect x="30" y="490" width="840" height="118" rx="14" fill="#fff1d5" stroke="#c6922d" stroke-width="2"/>
<text x="46" y="514" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#7b4b1a" letter-spacing="1">ESTOS NÚMEROS DEPENDEN DE…</text>
<g stroke="#c6922d" stroke-width="2" fill="#fffdf5">
<rect x="46" y="526" width="266" height="70" rx="10"/>
<rect x="327" y="526" width="266" height="70" rx="10"/>
