<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#6b4218">
<text x="179" y="548" font-size="13.5" font-weight="700">La ocupación del vehículo</text>
<text x="179" y="568" font-size="12" fill="#7b5a2e">Coche térmico, 1 persona: 145 g;</text>
<text x="179" y="586" font-size="12" fill="#7b5a2e">con 4 personas, 36 g por viajero-km.</text>
<text x="460" y="548" font-size="13.5" font-weight="700">El origen de la electricidad</text>
<text x="460" y="568" font-size="12" fill="#7b5a2e">El coche eléctrico suma las</text>
<text x="460" y="586" font-size="12" fill="#7b5a2e">emisiones de generar esa electricidad.</text>
<text x="731" y="548" font-size="13.5" font-weight="700">El ciclo de vida</text>
<text x="731" y="568" font-size="12" fill="#7b5a2e">Fabricar el vehículo y la batería</text>
<text x="731" y="586" font-size="12" fill="#7b5a2e">también emite: no está en la barra.</text>
</g>
</svg>
