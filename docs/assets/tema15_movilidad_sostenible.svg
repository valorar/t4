<rect x="30" y="366" width="840" height="112" rx="14" fill="#eef6f5" stroke="#bfdcdc" stroke-width="2"/>
<text x="46" y="388" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#14625f" letter-spacing="1">LA CADENA DEL POZO A LA RUEDA</text>
<text x="450" y="406" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#14625f">Las etapas 1 a 3 son «del pozo al tanque»; la etapa 4, «del tanque a la rueda». Casi nadie cuenta solo la etapa 4.</text>
