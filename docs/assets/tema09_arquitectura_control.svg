<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura de control de la estación</title>
<desc id="desc">Esquema de la estación de clasificación gobernada por un controlador. A la izquierda están las entradas: final de carrera, sensor óptico o infrarrojo, LDR de luz, sensor de distancia por ultrasonidos, termistor de temperatura y pulsador. En el centro está el controlador, que lee las entradas, convierte las señales analógicas en números con el convertidor analógico-digital, las compara con la consigna, decide qué debe ocurrir y ordena las salidas. A la derecha están las salidas: LED de señal, zumbador, servomotor, motor de la cinta con relé o etapa de potencia y electroválvula. Una flecha de realimentación baja desde las salidas y regresa a las entradas, porque un sensor mide el resultado y el programa corrige. Abajo figura el recordatorio de seguridad: solo con baja tensión autorizada, nunca la red eléctrica, y los actuadores se prueban sin cargas peligrosas.</desc>
<defs>
<marker id="m" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#1a6b7a"/></marker>
<marker id="mf" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#6b6fc4"/></marker>
</defs>
<rect width="900" height="620" rx="24" fill="#f7faf8"/>
<text x="450" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#18384a">La estación con control programado</text>
<text x="450" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#466a75">Entradas → programa → salidas, y una realimentación que mide el resultado.</text>

<rect x="330" y="96" width="240" height="34" rx="8" fill="#efeffa" stroke="#cfd3ec" stroke-width="2"/>
<text x="450" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#3b3f85">Consigna: lo que debe ocurrir</text>
<line x1="450" y1="130" x2="450" y2="138" stroke="#1a6b7a" stroke-width="3" marker-end="url(#m)"/>

<rect x="30" y="100" width="270" height="370" rx="14" fill="#eef6f5" stroke="#bfdcdc" stroke-width="2"/>
<text x="45" y="126" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#14625f" letter-spacing="1">ENTRADAS · SENSORES</text>
<g stroke="#1a6b7a" stroke-width="2" fill="#ffffff">
<rect x="45" y="140" width="240" height="46" rx="10"/>
<rect x="45" y="196" width="240" height="46" rx="10"/>
<rect x="45" y="252" width="240" height="46" rx="10"/>
<rect x="45" y="308" width="240" height="46" rx="10"/>
<rect x="45" y="364" width="240" height="46" rx="10"/>
<rect x="45" y="420" width="240" height="46" rx="10"/>
</g>
<g font-family="system-ui,sans-serif">
<text x="165" y="159" text-anchor="middle" font-size="14" font-weight="700" fill="#14495c">Final de carrera</text>
<text x="165" y="177" text-anchor="middle" font-size="12.5" fill="#3f6672">una pieza llega a su tope</text>
<text x="165" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#14495c">Sensor óptico o infrarrojo</text>
<text x="165" y="233" text-anchor="middle" font-size="12.5" fill="#3f6672">detecta el paso de una pieza</text>
<text x="165" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#14495c">LDR (luz)</text>
<text x="165" y="289" text-anchor="middle" font-size="12.5" fill="#3f6672">la luz cambia su resistencia</text>
<text x="165" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#14495c">Sensor ultrasónico</text>
<text x="165" y="345" text-anchor="middle" font-size="12.5" fill="#3f6672">mide distancia con el eco</text>
<text x="165" y="383" text-anchor="middle" font-size="14" font-weight="700" fill="#14495c">Termistor</text>
<text x="165" y="401" text-anchor="middle" font-size="12.5" fill="#3f6672">la temperatura cambia su resistencia</text>
<text x="165" y="439" text-anchor="middle" font-size="14" font-weight="700" fill="#14495c">Pulsador</text>
<text x="165" y="457" text-anchor="middle" font-size="12.5" fill="#3f6672">lo acciona una persona</text>
</g>

<rect x="330" y="140" width="240" height="290" rx="14" fill="#e7f3f6" stroke="#b8dae1" stroke-width="2"/>
<text x="450" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#164d5f" letter-spacing="0.5">CONTROLADOR · PROGRAMA</text>
<g stroke="#0b6680" stroke-width="2" fill="#ffffff">
<rect x="345" y="180" width="210" height="42" rx="10"/>
<rect x="345" y="230" width="210" height="42" rx="10"/>
<rect x="345" y="280" width="210" height="42" rx="10"/>
<rect x="345" y="330" width="210" height="42" rx="10"/>
</g>
<g font-family="system-ui,sans-serif" font-size="14" fill="#14495c" text-anchor="middle">
<text x="450" y="206">Lee todas las entradas</text>
<text x="450" y="256">Las compara con la consigna</text>
<text x="450" y="306">Decide qué debe ocurrir</text>
<text x="450" y="356">Ordena las salidas</text>
</g>
<text x="450" y="402" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#164d5f">Si una señal es analógica, el convertidor A/D</text>
<text x="450" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#164d5f">la transforma en un número antes de decidir.</text>

<rect x="600" y="100" width="270" height="370" rx="14" fill="#fff4d9" stroke="#e6cfa0" stroke-width="2"/>
<text x="615" y="126" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#7a540d" letter-spacing="1">SALIDAS · ACTUADORES</text>
<g stroke="#b8862b" stroke-width="2" fill="#ffffff">
<rect x="615" y="140" width="240" height="52" rx="10"/>
<rect x="615" y="204" width="240" height="52" rx="10"/>
<rect x="615" y="268" width="240" height="52" rx="10"/>
<rect x="615" y="332" width="240" height="52" rx="10"/>
<rect x="615" y="396" width="240" height="52" rx="10"/>
</g>
<g font-family="system-ui,sans-serif">
<text x="735" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#6b4a10">LED de señal</text>
<text x="735" y="180" text-anchor="middle" font-size="12.5" fill="#7a5c26">avisa con luz</text>
<text x="735" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#6b4a10">Zumbador</text>
<text x="735" y="244" text-anchor="middle" font-size="12.5" fill="#7a5c26">avisa con sonido</text>
<text x="735" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#6b4a10">Servomotor</text>
<text x="735" y="308" text-anchor="middle" font-size="12.5" fill="#7a5c26">gira a un ángulo concreto</text>
<text x="735" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#6b4a10">Motor de la cinta</text>
<text x="735" y="372" text-anchor="middle" font-size="12.5" fill="#7a5c26">con relé o etapa de potencia</text>
<text x="735" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#6b4a10">Electroválvula</text>
<text x="735" y="436" text-anchor="middle" font-size="12.5" fill="#7a5c26">deja pasar el aire comprimido</text>
</g>

<g stroke="#1a6b7a" stroke-width="3" marker-end="url(#m)">
<line x1="302" y1="200" x2="328" y2="200"/>
<line x1="302" y1="265" x2="328" y2="265"/>
<line x1="302" y1="330" x2="328" y2="330"/>
</g>
<g stroke="#1a6b7a" stroke-width="3" marker-end="url(#m)">
<line x1="572" y1="170" x2="598" y2="170"/>
<line x1="572" y1="265" x2="598" y2="265"/>
<line x1="572" y1="360" x2="598" y2="360"/>
</g>

<path d="M735 470 V505 H165 V474" fill="none" stroke="#6b6fc4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#mf)"/>
<text x="450" y="524" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#4a4e9c">REALIMENTACIÓN: el sensor mide el resultado y el programa corrige</text>

<rect x="30" y="540" width="840" height="64" rx="12" fill="#fff0ec" stroke="#e8b9ad" stroke-width="2"/>
<text x="450" y="566" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#713322">SEGURIDAD: solo con la fuente de muy baja tensión que autoriza el profesorado; nunca la red eléctrica.</text>
<text x="450" y="588" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#713322">Los actuadores se prueban sin cargas peligrosas y siempre con supervisión docente.</text>
</svg>
