<circle cx="616" cy="404" r="14" fill="#e4a83d" stroke="#fffdf8" stroke-width="3"/>
<text x="616" y="410" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#3c2a08">8</text>

<!-- ===================== LEYENDA ===================== -->
<rect x="40" y="580" width="880" height="186" rx="14" fill="#fffdf8" stroke="#d8e0df" stroke-width="2"/>
<text x="64" y="612" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#18384a">Cómo se lee este esquema</text>
<g font-family="system-ui,sans-serif" font-size="15" fill="#17262d">
  <text x="64" y="644">1 · Compresor y depósito: producen el aire.</text>
  <text x="64" y="674">2 · Filtro y regulador: limpian y ajustan la presión.</text>
  <text x="64" y="704">3 · Válvula 3/2 con pulsador y muelle.</text>
  <text x="64" y="734">4 · Cilindro de simple efecto: vuelve con el muelle.</text>
  <text x="500" y="644">5 · Válvula de señal 3/2: genera la orden.</text>
  <text x="500" y="674">6 · Línea de pilotaje 12/14: lleva la orden.</text>
  <text x="500" y="704">7 · Válvula 5/2: reparte el aire entre las cámaras.</text>
  <text x="500" y="734">8 · Cilindro de doble efecto: avanza y retrocede.</text>
</g>

<!-- ===================== NOTA DE SEGURIDAD ===================== -->
<rect x="40" y="782" width="880" height="76" rx="14" fill="#fff0ec" stroke="#c85c40" stroke-width="3"/>
<text x="64" y="812" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#713322">Antes de desmontar: cierra la válvula de cierre y despresuriza todo el circuito.</text>
<text x="64" y="840" font-family="system-ui,sans-serif" font-size="16" fill="#713322">Nunca dirijas el aire hacia el cuerpo: no hace falta un chorro fuerte para causar una lesión grave.</text>
</svg>
