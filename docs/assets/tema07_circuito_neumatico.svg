<text x="474" y="272" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#28567a">3</text>
<path d="M452 175 L452 120 L600 120 L600 188" fill="none" stroke="#1a6b7a" stroke-width="4" marker-end="url(#flecha)"/>
<text x="466" y="146" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#28567a">2</text>

<!-- Cilindro de simple efecto -->
<rect x="600" y="175" width="160" height="70" fill="#dfeff2" stroke="#1a6b7a" stroke-width="4"/>
<rect x="608" y="181" width="14" height="58" fill="#1a6b7a"/>
