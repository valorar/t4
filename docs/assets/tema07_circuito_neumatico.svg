<path d="M330 436 L330 396 L580 396 L580 440" fill="none" stroke="#1a6b7a" stroke-width="4" marker-end="url(#flecha)"/>
<text x="344" y="390" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#28567a">4</text>
