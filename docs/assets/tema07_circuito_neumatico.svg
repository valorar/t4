<text x="700" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#3c2a08">4</text>

<!-- ===================== B · CONTROL INDIRECTO ===================== -->
<text x="60" y="372" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#28567a">B · Control indirecto: válvula de señal y cilindro de doble efecto</text>

