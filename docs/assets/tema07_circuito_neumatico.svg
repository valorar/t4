<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 880" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Circuito neumático del expulsor de piezas: control directo e indirecto</title>
<desc id="descripcion">Esquema didáctico con dos circuitos numerados y su leyenda. Arriba, control directo: compresor y depósito, unidad de filtro y regulador, válvula distribuidora de 3/2 vías con pulsador y retorno por muelle, y cilindro de simple efecto que empuja una pieza. Abajo, control indirecto: una válvula de señal de 3/2 vías envía presión de pilotaje a una válvula de 5/2 vías que gobierna un cilindro de doble efecto. Los escapes disponen de silenciador y la zona de delante del vástago debe permanecer despejada.</desc>
<defs>
  <marker id="flecha" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0 5L10 0v10z" fill="#1a6b7a"/></marker>
  <marker id="flechaPiloto" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0 5L10 0v10z" fill="#a45f19"/></marker>
</defs>
<rect width="960" height="880" rx="24" fill="#f7faf8"/>

<!-- ===================== TÍTULO ===================== -->
<text x="480" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#18384a">Circuito del expulsor neumático</text>
<text x="480" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#58707a">Dos montajes para empujar una pieza con aire comprimido</text>

<!-- ===================== A · CONTROL DIRECTO ===================== -->
<text x="60" y="108" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#28567a">A · Control directo: válvula 3/2 y cilindro de simple efecto</text>

