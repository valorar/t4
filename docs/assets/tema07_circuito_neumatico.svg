<text x="186" y="156" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#3c2a08">2</text>

<!-- Válvula 3/2 -->
<line x1="250" y1="210" x2="300" y2="210" stroke="#1a6b7a" stroke-width="4" marker-end="url(#flecha)"/>
<path d="M342 210 L335 198 L328 222 L321 198 L314 222 L307 210" fill="none" stroke="#1a6b7a" stroke-width="3"/>
<line x1="305" y1="194" x2="305" y2="226" stroke="#1a6b7a" stroke-width="4"/>
