<text x="724" y="352" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#28567a">2</text>
<line x1="330" y1="506" x2="330" y2="540" stroke="#1a6b7a" stroke-width="4"/>
<text x="318" y="556" text-anchor="end" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#28567a">1</text>
<line x1="410" y1="506" x2="410" y2="528" stroke="#1a6b7a" stroke-width="4"/>
<line x1="396" y1="536" x2="424" y2="536" stroke="#1a6b7a" stroke-width="3"/>
<line x1="402" y1="544" x2="418" y2="544" stroke="#1a6b7a" stroke-width="3"/>
<text x="434" y="540" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#28567a">3 · 5</text>

<!-- Cilindro de doble efecto -->
<rect x="560" y="440" width="160" height="70" fill="#dfeff2" stroke="#1a6b7a" stroke-width="4"/>
<rect x="640" y="446" width="14" height="58" fill="#1a6b7a"/>
<line x1="654" y1="475" x2="798" y2="475" stroke="#1a6b7a" stroke-width="8" marker-end="url(#flecha)"/>
<rect x="804" y="461" width="36" height="28" rx="4" fill="#fff1d5" stroke="#c6922d" stroke-width="3"/>
