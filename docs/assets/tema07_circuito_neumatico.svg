<line x1="200" y1="466" x2="212" y2="450" stroke="#1a6b7a" stroke-width="3"/>
<circle cx="98" cy="404" r="14" fill="#e4a83d" stroke="#fffdf8" stroke-width="3"/>
<text x="98" y="410" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#3c2a08">5</text>

<!-- Línea de pilotaje -->
<path d="M132 441 L132 421 L272 421 L272 466 L298 466" fill="none" stroke="#a45f19" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#flechaPiloto)"/>
<circle cx="196" cy="404" r="14" fill="#e4a83d" stroke="#fffdf8" stroke-width="3"/>
<text x="196" y="410" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#3c2a08">6</text>

<!-- Válvula 5/2 -->
<rect x="300" y="436" width="140" height="70" fill="#dfeff2" stroke="#1a6b7a" stroke-width="4"/>
<line x1="370" y1="436" x2="370" y2="506" stroke="#1a6b7a" stroke-width="3"/>
