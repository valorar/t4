<text x="80" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#3c2a08">1</text>

<!-- Alimentación -->
<line x1="110" y1="210" x2="174" y2="210" stroke="#1a6b7a" stroke-width="4" marker-end="url(#flecha)"/>
<text x="142" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#58707a">6 bar</text>

<!-- Unidad de acondicionamiento simplificada -->
