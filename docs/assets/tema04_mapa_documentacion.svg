<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Mapa de la documentación técnica del proyecto</title><desc id="desc">La memoria técnica conecta requisitos, planos, lista de materiales y presupuesto, pruebas, versiones y fuentes.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#77959c"/></marker></defs><rect width="900" height="430" rx="24" fill="#f7faf8"/><text x="450" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#18384a">La documentación forma un sistema</text>
<g stroke="#77959c" stroke-width="3" marker-end="url(#a)"><line x1="450" y1="205" x2="220" y2="120"/><line x1="450" y1="205" x2="680" y2="120"/><line x1="450" y1="220" x2="210" y2="330"/><line x1="450" y1="220" x2="690" y2="330"/></g>
<rect x="325" y="155" width="250" height="120" rx="20" fill="#dfeff2" stroke="#1a6b7a" stroke-width="4"/><text x="450" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#28567a">Memoria técnica</text><text x="450" y="235" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#365862">explica y conecta</text>
<g font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle"><g fill="#e7f3ef" stroke="#2b8c7f" stroke-width="2"><rect x="70" y="75" width="250" height="70" rx="14"/><rect x="580" y="75" width="250" height="70" rx="14"/><rect x="70" y="305" width="250" height="70" rx="14"/><rect x="580" y="305" width="250" height="70" rx="14"/></g><g fill="#245c49"><text x="195" y="117">Requisitos y decisiones</text><text x="705" y="108">Planos, esquemas y</text><text x="705" y="130">lista de materiales</text><text x="195" y="347">Pruebas y resultados</text><text x="705" y="338">Versiones, fuentes</text><text x="705" y="360">y licencias</text></g></g>
